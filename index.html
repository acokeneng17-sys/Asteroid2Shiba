<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AST2 v5.5 FIX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#05080f;color:#fff;font-family:sans-serif;padding-bottom:80px}.header{background:#0f141c;padding:12px;text-align:center;color:#7fff00;font-weight:900}.card{background:#151e32;margin:10px;border-radius:16px;padding:16px;border:1px solid #1e2d4d}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800}.btn-g{background:#7fff00;color:#000}.btn-b{background:#2d9cdb;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0e19;display:flex;border-top:1px solid #1e2d4d}.nav div{flex:1;text-align:center;padding:10px 2px;font-size:10px;color:#8a8f98}.nav div.active{color:#2d9cdb;background:rgba(45,156,219,.1)}.page{display:none}.page.active{display:block}.circle{width:180px;height:180px;border:3px solid #7fff00;border-radius:50%;margin:15px auto;display:flex;flex-direction:column;justify-content:center;align-items:center}</style></head><body><div class="header">AST2 v5.5 ULTRA FIX ✅</div><div id="p-mining" class="page active"><div style="display:flex;justify-content:space-between;padding:10px"><div>TOTAL POINTS<br><b id="tp" style="color:#7fff00">0</b></div><div>AST2<br><b id="ast" style="color:#7fff00">0</b></div></div><div class="circle"><div id="mv" style="font-size:32px;font-weight:900">0.00</div><small id="tm">03:00:00</small></div><div style="padding:0 10px"><button class="btn btn-g" onclick="claim()">Claim (Min 5)</button><div style="height:6px;background:#0f172a;border-radius:3px;margin-top:10px"><div id="pb" style="height:100%;background:#7fff00;width:0%"></div></div></div></div><div id="p-task" class="page"><div class="card"><h3>Tasks TEST</h3><button class="btn btn-b" onclick="addP(500)">Join Telegram +500</button><p id="taskR"></p></div><div class="card"><h3>Spin 3x</h3><button class="btn btn-b" onclick="spin()">SPIN +100</button><p id="spR"></p></div></div><div id="p-ads" class="page"><div class="card" style="text-align:center"><h3>Ads 10x TEST</h3><button id="adB" class="btn btn-b" onclick="watchAd()">WATCH AD +100</button><p id="adR" style="color:#7fff00;font-weight:800"></p><p><span id="adC">0</span>/10</p></div></div><div id="p-wd" class="page"><div class="card"><h4>Swap 1000 = 100 AST2</h4><input id="swIn" type="number" value="1000" style="width:100%;padding:10px;background:#0a1220;border:1px solid #1e2d4d;color:#fff;border-radius:8px"><button class="btn btn-g" style="margin-top:8px" onclick="swap()">Swap</button></div></div><div id="p-ref" class="page"><div class="card"><h3>Referral</h3><div id="refL" style="background:#0a1220;padding:10px;border-radius:8px;font-size:11px">link</div></div></div><div id="p-booster" class="page"><div class="card"><h3>Booster</h3><button class="btn btn-g" onclick="addP(-5000)">Buy 5000 Points</button></div></div><div id="p-profil" class="page"><div class="card"><h3>Profile</h3><p>Test mode OK</p></div></div><div class="nav"><div class="active" id="n-mining" onclick="go('mining')">⛏️<br>Mining</div><div id="n-task" onclick="go('task')">🎯<br>Tasks</div><div id="n-ads" onclick="go('ads')">📺<br>Ads</div><div id="n-wd" onclick="go('wd')">💸<br>WD</div><div id="n-ref" onclick="go('ref')">👥<br>Ref</div><div id="n-booster" onclick="go('booster')">🚀<br>Boost</div><div id="n-profil" onclick="go('profil')">👤<br>Profil</div></div><script>let tp=parseInt(localStorage.getItem('tp')||'0');let ast=parseInt(localStorage.getItem('ast')||'0');let start=parseInt(localStorage.getItem('st')||'0');let acc=0;const MAX=250,DUR=3*60*60*1000;if(!start||Date.now()-start>DUR){start=Date.now();localStorage.setItem('st',start);}let adC=parseInt(localStorage.getItem('adC')||'0');let today=new Date().toDateString();let adD=localStorage.getItem('adD')||'';if(adD!==today){adC=0;localStorage.setItem('adC','0');localStorage.setItem('adD',today);}function upd(){document.getElementById('tp').innerText=tp;document.getElementById('ast').innerText=ast+' AST2';document.getElementById('adC').innerText=adC;let ab=document.getElementById('adB');if(ab)ab.disabled=adC>=10;if(ab)ab.innerText=adC>=10?'LIMIT 10/10':'WATCH AD +100';}function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('active'));document.getElementById('n-'+p).classList.add('active');}function tick(){let e=Date.now()-start;if(e>DUR)e=DUR;acc=e/DUR*MAX;document.getElementById('mv').innerText=acc.toFixed(2);let r=DUR-e;if(r<0)r=0;let h=Math.floor(r/3600000),m=Math.floor((r%3600000)/60000),s=Math.floor((r%60000)/1000);document.getElementById('tm').innerText=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('pb').style.width=(e/DUR*100)+'%';}function claim(){if(acc<5){alert('Min 5');return;}tp+=Math.floor(acc);localStorage.setItem('tp',tp);start=Date.now();localStorage.setItem('st',start);upd();alert('Claim '+Math.floor(acc));}function addP(v){tp+=v;localStorage.setItem('tp',tp);upd();}function watchAd(){if(adC>=10){alert('Limit');return;}adC++;tp+=100;localStorage.setItem('adC',adC);localStorage.setItem('tp',tp);localStorage.setItem('adD',today);upd();document.getElementById('adR').innerText='+100 POINTS! '+adC+'/10';}function spin(){tp+=100;localStorage.setItem('tp',tp);upd();}function swap(){let v=parseInt(document.getElementById('swIn').value);if(v>tp){alert('Not enough');return;}tp-=v;ast+=Math.floor(v/10);localStorage.setItem('tp',tp);localStorage.setItem('ast',ast);upd();}setInterval(tick,1000);tick();upd();</script></body></html>
